name: CI - Backend IA

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Entrenar modelo Random Forest (artefactos para tests)
        run: python -m app.models.training.train_random_forest

      - name: Tests (pytest)
        run: pytest -q
